name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Use the locked npm CLI
        run: npm install --global npm@12.0.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install locked demo frontend dependencies
        run: npm run install:demo-frontend
      - name: Build the demo frontend required by its contract tests
        run: npm run build:demo-frontend
      - name: Typecheck
        run: npm run typecheck
      - name: Run unit tests
        run: npm test

  quality:
    name: Release-quality checks
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Use the locked npm CLI
        run: npm install --global npm@12.0.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate workflows
        run: npm run check:workflows
      - name: Verify the npm candidate
        run: npm run pack:check
